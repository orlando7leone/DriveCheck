<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a160e" />
      <stop offset="70%" stop-color="#060c08" />
      <stop offset="100%" stop-color="#030604" />
    </radialGradient>

    <!-- Neon Green Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGlow)" stroke="#22c55e" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Outer subtle neon glow border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#4ade80" stroke-width="2" stroke-opacity="0.2" />

  <!-- Main Neon Icon Group -->
  <g filter="url(#neonGlow)">
    <!-- Car Body Silhouette (Neon Green Outline) -->
    <path
      d="M175 160 C210 148, 280 148, 335 165 C360 174, 385 200, 400 230 L435 250 C445 256, 452 268, 450 280 L442 335 C440 345, 432 355, 420 355 L385 355 C375 320, 340 295, 300 295 C260 295, 228 320, 218 355 L165 355"
      fill="none"
      stroke="#4ade80"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Roof and Windows -->
    <path
      d="M190 235 C205 185, 240 165, 310 165 C345 165, 370 190, 385 235 Z"
      fill="none"
      stroke="#4ade80"
      stroke-width="11"
      stroke-linejoin="round"
    />
    
    <!-- Windshield Divider -->
    <line x1="285" y1="168" x2="295" y2="235" stroke="#4ade80" stroke-width="9" stroke-linecap="round" />

    <!-- Hood Line & Headlight -->
    <path d="M385 240 L440 258" stroke="#4ade80" stroke-width="9" stroke-linecap="round" />
    <path d="M410 268 C425 268, 435 275, 432 285" stroke="#4ade80" stroke-width="9" fill="none" stroke-linecap="round" />

    <!-- Rear Wheel -->
    <circle cx="330" cy="355" r="34" fill="#08100a" stroke="#4ade80" stroke-width="12" />
    <circle cx="330" cy="355" r="12" fill="#4ade80" />

    <!-- Front Big Gear Wheel (DriveCheck signature icon) -->
    <!-- Gear center and hub -->
    <circle cx="165" cy="340" r="54" fill="#08100a" stroke="#4ade80" stroke-width="12" />
    <circle cx="165" cy="340" r="22" fill="#08100a" stroke="#4ade80" stroke-width="10" />
    <circle cx="165" cy="340" r="8" fill="#4ade80" />

    <!-- Gear Teeth (8 teeth symmetrically) -->
    <!-- 0 deg -->
    <rect x="156" y="272" width="18" height="18" rx="4" fill="#4ade80" />
    <!-- 180 deg -->
    <rect x="156" y="390" width="18" height="18" rx="4" fill="#4ade80" />
    <!-- 90 deg -->
    <rect x="224" y="331" width="18" height="18" rx="4" fill="#4ade80" />
    <!-- 270 deg -->
    <rect x="88" y="331" width="18" height="18" rx="4" fill="#4ade80" />
    <!-- 45 deg -->
    <rect x="204" y="291" width="18" height="18" rx="4" fill="#4ade80" transform="rotate(45 213 300)" />
    <!-- 135 deg -->
    <rect x="204" y="371" width="18" height="18" rx="4" fill="#4ade80" transform="rotate(45 213 380)" />
    <!-- 225 deg -->
    <rect x="108" y="371" width="18" height="18" rx="4" fill="#4ade80" transform="rotate(45 117 380)" />
    <!-- 315 deg -->
    <rect x="108" y="291" width="18" height="18" rx="4" fill="#4ade80" transform="rotate(45 117 300)" />

    <!-- Gear Spokes -->
    <line x1="165" y1="290" x2="165" y2="390" stroke="#4ade80" stroke-width="8" />
    <line x1="115" y1="340" x2="215" y2="340" stroke="#4ade80" stroke-width="8" />
  </g>
</svg>
